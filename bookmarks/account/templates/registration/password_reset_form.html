{% extends 'base.html' %}

{% block title %}Reiniciar contraseña{% endblock title %}

{% block content %}

    <h1>¿Olvidaste tu contraseña?</h1>
    <p>Ingresa tu correo para obtener una new contraseña</p>
    <form method="post">
        {{ form.as_p }}
        <p><input type="submit" value="Enviar correo"></p>
        {% csrf_token %}
    </form>
    
{% endblock content %}
